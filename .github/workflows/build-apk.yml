name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, lint & assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VR_KEYSTORE_BASE64: ${{ secrets.VR_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Decode optional release keystore
        if: ${{ env.VR_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$VR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vr-release.jks"
          test -s "$RUNNER_TEMP/vr-release.jks"

      - name: Unit tests, lint, APKs & instrumentation-test compilation
        env:
          VR_KEYSTORE_FILE: ${{ runner.temp }}/vr-release.jks
          VR_KEYSTORE_PASSWORD: ${{ secrets.VR_KEYSTORE_PASSWORD }}
          VR_KEY_ALIAS: ${{ secrets.VR_KEY_ALIAS }}
          VR_KEY_PASSWORD: ${{ secrets.VR_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest \
            lintDebug \
            assembleDebug \
            assembleRelease \
            assembleDebugAndroidTest

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/voice-reminder-vip-pro-1.0.0-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/voice-reminder-vip-pro-1.0.0-release-signed.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/voice-reminder-vip-pro-1.0.0-release-unsigned.apk
          else
            echo "Release APK output not found" >&2
            exit 1
          fi
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-reminder-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-reminder-vip-pro-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
